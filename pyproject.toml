[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twlegalrag"
version = "2.3.2"
description = "Source-available CLI for Taiwan Legal RAG, the hosted Taiwan law MCP server (台灣法律 MCP): semantic search over 22M+ Taiwan court judgments, statute and administrative-interpretation lookup, and a bundle-level citation check. Retrieval-only; not legal advice."
readme = "README.md"
license = { text = "Elastic-2.0" }
requires-python = ">=3.9"
authors = [{ name = "Dr.Legal (dr-legal.com.tw)" }]
keywords = ["taiwan", "legal", "law", "taiwan-law", "taiwan-legal", "mcp", "mcp-server", "model-context-protocol", "judgments", "statutes", "rag", "retrieval", "semantic-search", "citation", "台灣法律", "台灣法律MCP"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Chinese (Traditional)",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
twlegalrag = "twlegalrag.cli:app"

[project.urls]
Homepage = "https://dr-legal.com.tw"
Source = "https://github.com/aa0101181514/tw-legal-rag"
Issues = "https://github.com/aa0101181514/tw-legal-rag/issues"

[tool.hatch.build.targets.wheel]
packages = ["twlegalrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
